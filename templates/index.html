<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Recommender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 mb-1">Music Recommender</h1>
        <p class="text-muted mb-0">Describe the music you want and get matching tracks from the GTZAN dataset.</p>
      </div>
      <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" type="button">Dark mode</button>
    </div>

    <form id="search-form" class="card card-body mb-4">
      <label for="description" class="form-label fw-semibold">Description</label>
      <input id="description" class="form-control mb-3" placeholder="e.g. a calm, sad song with piano for a rainy evening" required>

      <div class="mb-3">
        <span class="form-label fw-semibold d-block">Mood</span>
        <div id="emojis" class="d-flex flex-wrap gap-2"></div>
      </div>

      <div class="mb-3">
        <span class="form-label fw-semibold d-block">Instruments</span>
        <div id="instruments" class="d-flex flex-wrap gap-2"></div>
      </div>

      <button class="btn btn-primary align-self-start" type="submit">Search</button>
    </form>

    <div id="status" class="mb-3 text-muted"></div>
    <div id="results" class="row g-3"></div>
  </main>

  <script>
    const AUDIO_AVAILABLE = {{ 'true' if audio_available else 'false' }};
    const EMOJIS = ['😊', '😃', '🥳', '😌', '😢', '😭', '🔥', '😎'];
    const INSTRUMENTS = ['guitar', 'piano', 'saxophone', 'violin', 'drums'];
    const selected = { emotions: new Set(), instruments: new Set() };

    function renderChips(containerId, values, set, cls) {
      const container = document.getElementById(containerId);
      values.forEach((value) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = `chip ${cls}`;
        chip.textContent = value;
        chip.addEventListener('click', () => {
          set.has(value) ? set.delete(value) : set.add(value);
          chip.classList.toggle('active');
        });
        container.appendChild(chip);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderResults(data) {
      const results = document.getElementById('results');
      results.innerHTML = '';
      document.getElementById('status').textContent =
        `Detected sentiment: ${data.sentiment} · ${data.recommendations.length} recommendations`;

      data.recommendations.forEach((rec) => {
        const audio = AUDIO_AVAILABLE ? `<audio controls preload="none" class="w-100 mt-2" src="${rec.audio_url}"></audio>` : '';
        results.insertAdjacentHTML('beforeend', `
          <div class="col-md-6 col-lg-4">
            <div class="card h-100">
              <div class="card-body">
                <span class="badge text-bg-secondary text-uppercase mb-2">${escapeHtml(rec.genre)}</span>
                <h2 class="h6 card-title">${escapeHtml(rec.filename)}</h2>
                <p class="card-text small">${escapeHtml(rec.description)}</p>
                <small class="text-muted">score ${rec.score.toFixed(3)} (similarity ${rec.similarity.toFixed(3)})</small>
                ${audio}
              </div>
            </div>
          </div>`);
      });
    }

    document.getElementById('search-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const status = document.getElementById('status');
      status.textContent = 'Searching...';

      const response = await fetch('/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          description: document.getElementById('description').value,
          emotions: [...selected.emotions],
          instruments: [...selected.instruments],
        }),
      });
      const data = await response.json();
      if (!response.ok) {
        status.textContent = data.error || 'Something went wrong.';
        return;
      }
      renderResults(data);
    });

    const toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', () => {
      const dark = document.body.classList.toggle('dark-mode');
      toggle.textContent = dark ? 'Light mode' : 'Dark mode';
    });

    renderChips('emojis', EMOJIS, selected.emotions, 'emoji');
    renderChips('instruments', INSTRUMENTS, selected.instruments, 'instrument');
  </script>
</body>
</html>
