name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (without the neural model)
        run: pip install flask qdrant-client textblob pandas python-dotenv pytest
      - name: Run tests
        run: pytest -v
